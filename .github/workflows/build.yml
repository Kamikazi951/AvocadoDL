name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Set up Node for parser tests
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - name: Build addon
      shell: powershell
      run: .\build.ps1

    - name: Regression and packaged extraction tests
      run: |
        python -m unittest discover -s tests -v
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        node --test tests/parser.cjs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Get built filename
      shell: powershell
      run: |
        $fda = (Get-Item avocadodl-*.fda).Name
        Add-Content $env:GITHUB_ENV "FDA_FILE=$fda"

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: avocadodl
        path: ${{ env.FDA_FILE }}

    - name: Upload release asset
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ${{ env.FDA_FILE }}
        asset_name: avocadodl.fda
        asset_content_type: application/zip
